<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-select=none">
    <title>Super Adventure Voxel - 20 Fases</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #050811;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 15px 50px rgba(0,0,0,0.9);
            border-radius: 4px;
            overflow: hidden;
            border: 4px solid #1e293b;
        }
        canvas {
            display: block;
            background: #000;
            image-rendering: pixelated;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 10;
        }
        .ui-element {
            background: rgba(15, 23, 42, 0.85);
            padding: 8px 16px;
            border-radius: 0px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
        }
        
        #btn-pause-top {
            pointer-events: auto;
            background: #eab308;
            color: #000;
            border: 3px solid #fef08a;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: 900;
            font-family: monospace;
            cursor: pointer;
            box-shadow: 3px 3px 0px #0f172a;
        }
        #btn-pause-top:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #0f172a;
        }

        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
        }
        .modal-title {
            font-size: 48px;
            font-weight: 900;
            color: #f59e0b;
            text-shadow: 4px 4px 0px #000;
            margin-bottom: 25px;
            letter-spacing: 3px;
        }
        .menu-btn {
            width: 220px;
            padding: 14px 0;
            margin: 8px 0;
            background: #2563eb;
            color: #fff;
            border: 4px solid #93c5fd;
            font-size: 18px;
            font-weight: 900;
            font-family: monospace;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            text-align: center;
        }
        .menu-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000;
            background: #3b82f6;
        }

        #levels-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-width: 400px;
            margin-bottom: 15px;
        }
        .lvl-btn {
            width: 55px;
            height: 55px;
            background: #334155;
            color: #fff;
            border: 3px solid #cbd5e1;
            font-size: 18px;
            font-weight: bold;
            font-family: monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
        }
        .lvl-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
            background: #eab308;
            color: #000;
        }

        #controls-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            z-index: 10;
        }
        .d-pad, .jump-pad {
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }
        .btn-ctrl {
            width: 64px;
            height: 64px;
            background: #334155;
            border: 4px solid #cbd5e1;
            border-radius: 0px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            font-family: monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 4px 4px 0px #0f172a;
            transition: transform 0.05s, background 0.05s;
            touch-action: manipulation;
        }
        .btn-ctrl:active, .btn-ctrl.pressed {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #0f172a;
            background: #64748b;
            border-color: #f59e0b;
        }
        .btn-jump {
            width: 120px;
            background: #15803d;
            border-color: #86efac;
            font-size: 14px;
        }
        .btn-jump:active, .btn-jump.pressed {
            background: #22c55e;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui">
        <div class="ui-element">MOEDAS: <span id="coins-txt" style="color: #f59e0b;">0</span></div>
        <button id="btn-pause-top">PAUSE</button>
        <div class="ui-element">VIDAS: <span id="lives-txt" style="color: #ef4444;">3</span></div>
    </div>

    <!-- Menu Principal -->
    <div id="main-menu" class="modal-overlay">
        <div class="modal-title">ADVENTURES</div>
        <button class="menu-btn" id="btn-play">PLAY</button>
        <button class="menu-btn" id="btn-fases-menu">FASES</button>
    </div>

    <!-- Menu de Pause -->
    <div id="pause-menu" class="modal-overlay" style="display: none;">
        <div class="modal-title">PAUSADO</div>
        <button class="menu-btn" id="btn-resume">CONTINUAR</button>
        <button class="menu-btn" id="btn-retry">RETRY</button>
        <button class="menu-btn" id="btn-menu-back">MENU</button>
    </div>

    <!-- Menu de Fases -->
    <div id="levels-menu" class="modal-overlay" style="display: none;">
        <div class="modal-title" style="font-size: 32px;">SELECIONE A FASE</div>
        <div id="levels-grid"></div>
        <button class="menu-btn" id="btn-back-main" style="width: 150px; padding: 8px 0; font-size: 14px; margin-top: 15px;">VOLTAR</button>
    </div>

    <canvas id="canvas" width="960" height="540"></canvas>

    <!-- Controls -->
    <div id="controls-container">
        <div class="d-pad">
            <div class="btn-ctrl" id="btn-left">&lt;</div>
            <div class="btn-ctrl" id="btn-right">&gt;</div>
        </div>
        <div class="jump-pad">
            <div class="btn-ctrl btn-jump" id="btn-jump">PULAR</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const coinsTxt = document.getElementById('coins-txt');
const livesTxt = document.getElementById('lives-txt');

const mainMenu = document.getElementById('main-menu');
const pauseMenu = document.getElementById('pause-menu');
const levelsMenu = document.getElementById('levels-menu');
const btnPauseTop = document.getElementById('btn-pause-top');
const btnPlay = document.getElementById('btn-play');
const btnFasesMenu = document.getElementById('btn-fases-menu');
const btnResume = document.getElementById('btn-resume');
const btnRetry = document.getElementById('btn-retry');
const btnMenuBack = document.getElementById('btn-menu-back');
const btnBackMain = document.getElementById('btn-back-main');
const levelsGrid = document.getElementById('levels-grid');

let currentLevel = 1;
const maxLevels = 20;
let coinsCollected = 0;
let lives = 3;
let gameOver = false;
let gameWon = false;
let isPaused = false;
let inMainMenu = true;
let gameTime = 0;

const keys = {};
const touchControls = { left: false, right: false, jump: false };

window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

function setupBtn(id, controlProp) {
    const btn = document.getElementById(id);
    const start = (e) => { e.preventDefault(); touchControls[controlProp] = true; btn.classList.add('pressed'); };
    const end = (e) => { e.preventDefault(); touchControls[controlProp] = false; btn.classList.remove('pressed'); };

    btn.addEventListener('touchstart', start);
    btn.addEventListener('touchend', end);
    btn.addEventListener('mousedown', start);
    btn.addEventListener('mouseup', end);
    btn.addEventListener('mouseleave', end);
}
setupBtn('btn-left', 'left');
setupBtn('btn-right', 'right');
setupBtn('btn-jump', 'jump');

for (let i = 1; i <= maxLevels; i++) {
    const lvlBtn = document.createElement('div');
    lvlBtn.className = 'lvl-btn';
    lvlBtn.innerText = i;
    lvlBtn.onclick = () => {
        currentLevel = i;
        levelsMenu.style.display = 'none';
        startGame();
    };
    levelsGrid.appendChild(lvlBtn);
}

btnPlay.onclick = () => { startGame(); };
btnFasesMenu.onclick = () => { mainMenu.style.display = 'none'; levelsMenu.style.display = 'flex'; };
btnBackMain.onclick = () => { levelsMenu.style.display = 'none'; mainMenu.style.display = 'flex'; };
btnPauseTop.onclick = () => { if (inMainMenu) return; isPaused = true; pauseMenu.style.display = 'flex'; };
btnResume.onclick = () => { isPaused = false; pauseMenu.style.display = 'none'; };

btnRetry.onclick = () => {
    isPaused = false;
    pauseMenu.style.display = 'none';
    lives = 3;
    coinsCollected = 0;
    coinsTxt.innerText = coinsCollected;
    livesTxt.innerText = lives;
    gameOver = false;
    gameWon = false;
    loadLevel(currentLevel);
};

btnMenuBack.onclick = () => {
    isPaused = false;
    inMainMenu = true;
    pauseMenu.style.display = 'none';
    mainMenu.style.display = 'flex';
};

function startGame() {
    inMainMenu = false;
    isPaused = false;
    mainMenu.style.display = 'none';
    lives = 3;
    coinsCollected = 0;
    coinsTxt.innerText = coinsCollected;
    livesTxt.innerText = lives;
    gameOver = false;
    gameWon = false;
    loadLevel(currentLevel);
}

const camera = { x: 0, y: 0 };

let clouds = [];
for(let i=0; i<12; i++) {
    clouds.push({
        x: Math.random() * 8000,
        y: Math.random() * 120 + 20,
        w: Math.random() * 80 + 60,
        h: Math.random() * 20 + 20,
        speed: Math.random() * 0.4 + 0.2
    });
}

let particles = [];
function createSplash(x, y) {
    for (let i = 0; i < 15; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: -Math.random() * 5 - 2,
            size: Math.random() * 6 + 2,
            color: '#38bdf8',
            life: 25
        });
    }
}

function createSmoke(x, y) {
    for (let i = 0; i < 20; i++) {
        particles.push({
            x: x + Math.random() * 20 - 10,
            y: y + Math.random() * 20 - 10,
            vx: (Math.random() - 0.5) * 4,
            vy: -Math.random() * 3 - 1,
            size: Math.random() * 12 + 6,
            color: Math.random() > 0.5 ? '#94a3b8' : '#cbd5e1',
            life: 30
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawParticles() {
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - camera.x, p.y, p.size, p.size);
    });
}

const player = {
    x: 80,
    y: 100,
    width: 32,
    height: 48,
    vx: 0,
    vy: 0,
    speed: 4.2,
    jumpForce: 13.5,
    bounceForce: 19, // Pulo mais alto do trampolim
    gravity: 0.6,
    grounded: false,
    facing: 'right',
    reset: function() {
        this.x = 80;
        this.y = 100;
        this.vx = 0;
        this.vy = 0;
    }
};

let platforms = [];
let waterZones = [];
let coins = [];
let enemies = [];
let trampolines = [];
let flag = null;

function loadLevel(lvl) {
    platforms = [];
    waterZones = [];
    coins = [];
    enemies = [];
    trampolines = [];
    player.reset();

    const worldWidth = 6000 + lvl * 800;
    let currentX = 0;

    platforms.push({ x: 0, y: 440, width: 480, height: 100, type: 'dirt' });
    currentX = 480;

    while (currentX < worldWidth - 500) {
        let rand = Math.random();

        if (rand < 0.35) {
            let riverWidth = 160 + Math.random() * 160;
            waterZones.push({ x: currentX, y: 460, width: riverWidth, height: 80 });

            let logs = Math.floor(riverWidth / 80);
            for (let i = 0; i < logs; i++) {
                platforms.push({
                    x: currentX + 30 + (i * 75),
                    y: 350 - (Math.random() * 40),
                    width: 60,
                    height: 24,
                    type: 'log'
                });
            }
            currentX += riverWidth;
        } 
        else {
            let landWidth = 240 + Math.random() * 320;
            platforms.push({ x: currentX, y: 440, width: landWidth, height: 100, type: 'dirt' });

            // Trampolim de Cogumelo no chão
            if (Math.random() < 0.45) {
                trampolines.push({
                    x: currentX + 40 + Math.random() * (landWidth - 100),
                    y: 404,
                    width: 36,
                    height: 36,
                    bounceTimer: 0
                });
            }

            if (Math.random() > 0.4) {
                let platY = 300 - Math.random() * 50;
                platforms.push({
                    x: currentX + 60,
                    y: platY,
                    width: 100,
                    height: 24,
                    type: 'log'
                });

                coins.push({ x: currentX + 80, y: platY - 45, collected: false });
                coins.push({ x: currentX + 120, y: platY - 45, collected: false });
            }

            if (Math.random() < 0.3 + (lvl * 0.02)) {
                enemies.push({
                    x: currentX + 100,
                    y: 396,
                    width: 44,
                    height: 44,
                    vx: (Math.random() > 0.5 ? 1 : -1) * (1.8 + lvl * 0.1),
                    minX: currentX,
                    maxX: currentX + landWidth - 44,
                    hp: 2,
                    flashTimer: 0
                });
            }

            if (Math.random() > 0.3) {
                coins.push({ x: currentX + landWidth / 2, y: 390, collected: false });
            }

            currentX += landWidth;
        }
    }

    platforms.push({ x: currentX, y: 440, width: 600, height: 100, type: 'dirt' });
    flag = { x: currentX + 250, y: 260, width: 24, height: 180 };
}

function update() {
    if (gameOver || gameWon || isPaused || inMainMenu) return;
    gameTime++;

    const moveLeft = keys['KeyA'] || keys['ArrowLeft'] || touchControls.left;
    const moveRight = keys['KeyD'] || keys['ArrowRight'] || touchControls.right;
    const moveJump = keys['KeyW'] || keys['Space'] || keys['ArrowUp'] || touchControls.jump;

    if (moveLeft) {
        player.vx = -player.speed;
        player.facing = 'left';
    } else if (moveRight) {
        player.vx = player.speed;
        player.facing = 'right';
    } else {
        player.vx *= 0.75;
    }

    if (moveJump && player.grounded) {
        player.vy = -player.jumpForce;
        player.grounded = false;
    }

    player.vy += player.gravity;
    player.x += player.vx;
    player.y += player.vy;

    if (player.x < 0) player.x = 0;

    player.grounded = false;

    // Colisão Plataformas
    platforms.forEach(p => {
        if (player.x < p.x + p.width &&
            player.x + player.width > p.x &&
            player.y + player.height > p.y &&
            player.y + player.height < p.y + p.height + player.vy + 4) {
            
            if (player.vy > 0) {
                player.grounded = true;
                player.vy = 0;
                player.y = p.y - player.height;
            }
        }
    });

    // Colisão Cogumelos Trampolim
    trampolines.forEach(t => {
        if (t.bounceTimer > 0) t.bounceTimer--;

        if (player.x < t.x + t.width &&
            player.x + player.width > t.x &&
            player.y + player.height >= t.y &&
            player.y + player.height <= t.y + t.height + player.vy + 6) {
            
            if (player.vy > 0) {
                player.vy = -player.bounceForce; // Lança bem alto
                player.grounded = false;
                t.bounceTimer = 10; // Ativa animação de compressão
            }
        }
    });

    // Colisão Água
    waterZones.forEach(w => {
        if (player.x + player.width > w.x && player.x < w.x + w.width && player.y + player.height > w.y + 20) {
            createSplash(player.x + player.width / 2, player.y + player.height);
            takeDamage();
        }
    });

    if (player.y > canvas.height + 100) {
        takeDamage();
    }

    // Inimigos
    enemies.forEach((enemy, index) => {
        enemy.x += enemy.vx;
        if (enemy.x <= enemy.minX || enemy.x >= enemy.maxX) {
            enemy.vx *= -1;
        }

        if (enemy.flashTimer > 0) enemy.flashTimer--;

        if (player.x < enemy.x + enemy.width &&
            player.x + player.width > enemy.x &&
            player.y < enemy.y + enemy.height &&
            player.y + player.height > enemy.y) {
            
            if (player.vy > 0 && player.y + player.height - player.vy <= enemy.y + 16) {
                player.vy = -player.jumpForce * 0.65;
                enemy.hp--;
                enemy.flashTimer = 18;

                if (enemy.hp <= 0) {
                    createSmoke(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);
                    enemies.splice(index, 1);
                    coinsCollected += 3;
                    coinsTxt.innerText = coinsCollected;
                }
            } else {
                takeDamage();
            }
        }
    });

    // Moedas
    coins.forEach(c => {
        if (!c.collected && 
            player.x < c.x + 32 && player.x + player.width > c.x &&
            player.y < c.y + 32 && player.y + player.height > c.y) {
            c.collected = true;
            coinsCollected++;
            coinsTxt.innerText = coinsCollected;
        }
    });

    // Bandeira Final
    if (flag && player.x < flag.x + flag.width && player.x + player.width > flag.x &&
        player.y < flag.y + flag.height && player.y + player.height > flag.y) {
        if (currentLevel < maxLevels) {
            currentLevel++;
            loadLevel(currentLevel);
        } else {
            gameWon = true;
        }
    }

    camera.x += (player.x - canvas.width / 3 - camera.x) * 0.1;

    clouds.forEach(c => {
        c.x += c.speed;
        if (c.x > 8500) c.x = -100;
    });

    updateParticles();
}

function takeDamage() {
    lives--;
    livesTxt.innerText = lives;
    if (lives <= 0) {
        gameOver = true;
    } else {
        player.reset();
    }
}

function draw() {
    let skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    skyGradient.addColorStop(0, '#0284c7');
    skyGradient.addColorStop(1, '#38bdf8');
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    let sunX = 800 - camera.x * 0.04;
    ctx.fillStyle = '#fef08a';
    ctx.fillRect(sunX, 40, 60, 60);
    ctx.fillStyle = '#fde047';
    ctx.fillRect(sunX + 6, 46, 48, 48);

    clouds.forEach(c => {
        let cx = c.x - camera.x * 0.15;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.fillRect(cx, c.y, c.w, c.h);
        ctx.fillRect(cx + 15, c.y - 12, c.w - 30, 12);
    });

    ctx.save();

    // Plataformas
    platforms.forEach(p => {
        let px = p.x - camera.x;
        
        if (p.type === 'dirt') {
            ctx.fillStyle = '#57331c';
            ctx.fillRect(px, p.y, p.width, p.height);

            ctx.fillStyle = '#3d2314';
            for (let bx = 0; bx < p.width; bx += 16) {
                for (let by = 16; by < p.height; by += 16) {
                    if ((bx + by) % 32 === 0) {
                        ctx.fillRect(px + bx, p.y + by, 8, 8);
                    }
                }
            }

            ctx.fillStyle = '#4ade80';
            ctx.fillRect(px, p.y, p.width, 14);

            ctx.fillStyle = '#16a34a';
            ctx.fillRect(px, p.y + 10, p.width, 4);

            ctx.fillStyle = '#22c55e';
            for (let g = 0; g < p.width; g += 16) {
                ctx.fillRect(px + g, p.y + 14, 8, 6);
                ctx.fillRect(px + g + 8, p.y + 14, 4, 3);
            }
        } 
        else if (p.type === 'log') {
            ctx.fillStyle = '#78350f';
            ctx.fillRect(px, p.y, p.width, p.height);

            ctx.fillStyle = '#451a03';
            ctx.fillRect(px, p.y, p.width, 4);
            ctx.fillRect(px, p.y + p.height - 4, p.width, 4);
            
            ctx.fillStyle = '#92400e';
            for (let lx = 10; lx < p.width; lx += 20) {
                ctx.fillRect(px + lx, p.y + 6, 12, p.height - 12);
            }
        }
    });

    // Desenhar Cogumelos Trampolim
    trampolines.forEach(t => {
        let tx = t.x - camera.x;
        let ty = t.y;
        let squish = t.bounceTimer > 0 ? 8 : 0; // Achata quando pisa

        // Caule do Cogumelo
        ctx.fillStyle = '#fef3c7';
        ctx.fillRect(tx + 10, ty + 18 + squish, 16, 18 - squish);
        ctx.fillStyle = '#d97706';
        ctx.fillRect(tx + 12, ty + 22 + squish, 4, 10 - squish);

        // Chapéu Vermelho do Cogumelo
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(tx, ty + squish, 36, 18);
        ctx.fillRect(tx + 4, ty - 4 + squish, 28, 4);

        // Pontas Brancas do Cogumelo
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(tx + 6, ty + 4 + squish, 6, 6);
        ctx.fillRect(tx + 24, ty + 4 + squish, 6, 6);
        ctx.fillRect(tx + 15, ty + 10 + squish, 6, 5);
    });

    // Água
    waterZones.forEach(w => {
        let wx = w.x - camera.x;
        
        ctx.fillStyle = 'rgba(14, 165, 233, 0.75)';
        ctx.fillRect(wx, w.y, w.width, w.height);

        ctx.fillStyle = '#0369a1';
        ctx.fillRect(wx, w.y + 20, w.width, w.height - 20);

        ctx.fillStyle = '#e0f2fe';
        for (let waveX = 0; waveX < w.width; waveX += 16) {
            let offset = (Math.sin((gameTime * 0.1) + waveX) > 0) ? 0 : 3;
            ctx.fillRect(wx + waveX, w.y + offset, 12, 4);
        }
    });

    // Moedas
    coins.forEach(c => {
        if (!c.collected) {
            let cx = c.x - camera.x + 16;
            let cy = c.y + 16;
            
            let scaleX = Math.abs(Math.sin((gameTime + c.x) * 0.05));
            let coinW = Math.max(4, 30 * scaleX);
            let coinH = 32;

            ctx.save();
            
            let glow = ctx.createRadialGradient(cx, cy, 2, cx, cy, 22);
            glow.addColorStop(0, 'rgba(255, 215, 0, 0.6)');
            glow.addColorStop(1, 'rgba(255, 215, 0, 0)');
            ctx.fillStyle = glow;
            ctx.fillRect(cx - 22, cy - 22, 44, 44);

            ctx.fillStyle = '#b45309';
            ctx.fillRect(cx - coinW/2 - 1, cy - coinH/2 - 1, coinW + 2, coinH + 2);

            let goldGrad = ctx.createLinearGradient(cx - coinW/2, cy - coinH/2, cx + coinW/2, cy + coinH/2);
            goldGrad.addColorStop(0, '#fef08a');
            goldGrad.addColorStop(0.3, '#f59e0b');
            goldGrad.addColorStop(0.7, '#d97706');
            goldGrad.addColorStop(1, '#78350f');
            ctx.fillStyle = goldGrad;
            ctx.fillRect(cx - coinW/2, cy - coinH/2, coinW, coinH);

            if (coinW > 12) {
                ctx.fillStyle = '#b45309';
                ctx.fillRect(cx - coinW/2 + 3, cy - coinH/2 + 3, coinW - 6, coinH - 6);
                
                ctx.fillStyle = '#fbbf24';
                ctx.fillRect(cx - coinW/2 + 4, cy - coinH/2 + 4, coinW - 8, coinH - 8);

                ctx.fillStyle = '#78350f';
                ctx.fillRect(cx - 2, cy - 8, 4, 16);
                ctx.fillRect(cx - 5, cy - 6, 10, 3);
                ctx.fillRect(cx - 5, cy - 1, 10, 3);
                ctx.fillRect(cx - 5, cy + 4, 10, 3);
            }

            let flashX = cx - coinW/2 + ((gameTime * 2 + c.x) % (coinW + 10)) - 5;
            if (flashX > cx - coinW/2 && flashX < cx + coinW/2) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.fillRect(flashX, cy - coinH/2 + 2, 3, coinH - 4);
            }

            ctx.restore();
        }
    });

    // Inimigos Roxos
    enemies.forEach(e => {
        let ex = e.x - camera.x;
        let ey = e.y;
        let isFlashing = e.flashTimer > 0 && Math.floor(e.flashTimer / 3) % 2 === 0;

        ctx.save();

        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.fillRect(ex + 4, ey + e.height - 4, e.width - 8, 6);

        let bounce = Math.sin(gameTime * 0.15) * 2;
        ey += bounce;

        if (isFlashing) {
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(ex, ey, e.width, e.height);
            ctx.fillStyle = '#f87171';
            ctx.fillRect(ex + 4, ey + 4, e.width - 8, e.height - 8);
        } else {
            let bodyGrad = ctx.createLinearGradient(ex, ey, ex + e.width, ey + e.height);
            bodyGrad.addColorStop(0, '#a855f7');
            bodyGrad.addColorStop(0.5, '#7e22ce');
            bodyGrad.addColorStop(1, '#3b0764');
            ctx.fillStyle = bodyGrad;
            ctx.fillRect(ex, ey, e.width, e.height);

            ctx.fillStyle = '#581c87';
            ctx.fillRect(ex, ey + e.height - 6, e.width, 6);
            ctx.fillRect(ex, ey, 4, e.height);
            ctx.fillRect(ex + e.width - 4, ey, 4, e.height);

            ctx.fillStyle = '#e9d5ff';
            ctx.fillRect(ex + 6, ey - 8, 6, 8);
            ctx.fillRect(ex + e.width - 12, ey - 8, 6, 8);
            ctx.fillStyle = '#c084fc';
            ctx.fillRect(ex + 8, ey - 6, 4, 6);
            ctx.fillRect(ex + e.width - 10, ey - 6, 4, 6);

            let look = e.vx > 0 ? 4 : -2;
            ctx.fillStyle = '#fef08a';
            ctx.fillRect(ex + 8 + look, ey + 12, 10, 10);
            ctx.fillRect(ex + 24 + look, ey + 12, 10, 10);

            ctx.fillStyle = '#dc2626';
            ctx.fillRect(ex + 12 + look, ey + 14, 4, 6);
            ctx.fillRect(ex + 28 + look, ey + 14, 4, 6);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(ex + 9 + look, ey + 13, 3, 3);
            ctx.fillRect(ex + 25 + look, ey + 13, 3, 3);

            ctx.fillStyle = '#1e1b4b';
            ctx.fillRect(ex + 10, ey + 28, e.width - 20, 8);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(ex + 12, ey + 28, 4, 4);
            ctx.fillRect(ex + 20, ey + 28, 4, 4);
            ctx.fillRect(ex + 28, ey + 28, 4, 4);
            ctx.fillRect(ex + 16, ey + 32, 4, 4);
            ctx.fillRect(ex + 24, ey + 32, 4, 4);

            if (e.hp === 1) {
                ctx.fillStyle = '#dc2626';
                ctx.fillRect(ex + 8, ey + 4, 10, 3);
                ctx.fillRect(ex + e.width - 18, ey + 6, 12, 3);
            }
        }

        ctx.restore();
    });

    // Bandeira Final
    if (flag) {
        let fx = flag.x - camera.x;
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(fx, flag.y, flag.width, flag.height);
        
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(fx - 4, flag.y - 8, 32, 10);

        ctx.fillStyle = '#dc2626';
        ctx.fillRect(fx + flag.width, flag.y + 10, 60, 45);
        ctx.fillStyle = '#b91c1c';
        ctx.fillRect(fx + flag.width, flag.y + 20, 50, 25);
    }

    // Personagem
    let px = player.x - camera.x;
    let py = player.y;

    ctx.fillStyle = '#ef4444';
    ctx.fillRect(px + 4, py, 24, 8);
    ctx.fillRect(px + (player.facing === 'right' ? 8 : 0), py + 4, 24, 4);

    ctx.fillStyle = '#fde047';
    ctx.fillRect(px + 6, py + 8, 20, 10);

    ctx.fillStyle = '#000';
    let eyeX = player.facing === 'right' ? 18 : 8;
    ctx.fillRect(px + eyeX, py + 10, 4, 4);

    ctx.fillStyle = '#dc2626';
    ctx.fillRect(px + 4, py + 18, 24, 12);

    ctx.fillStyle = '#2563eb';
    ctx.fillRect(px + 6, py + 26, 20, 14);

    ctx.fillStyle = '#78350f';
    ctx.fillRect(px + 2, py + 40, 12, 8);
    ctx.fillRect(px + 18, py + 40, 12, 8);

    drawParticles();

    ctx.restore();

    if (gameOver) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = '900 40px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('VOCE MORREU!', canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = '#fff';
        ctx.font = '16px monospace';
        ctx.fillText('RECARREGUE A PAGINA PARA RECOMEÇAR', canvas.width / 2, canvas.height / 2 + 30);
    }

    if (gameWon) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fbbf24';
        ctx.font = '900 40px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('PARABENS! JOGO ZERADO!', canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = '#fff';
        ctx.font = '16px monospace';
        ctx.fillText(`MOEDAS COLETADAS: ${coinsCollected}`, canvas.width / 2, canvas.height / 2 + 30);
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

loadLevel(1);
gameLoop();

</script>
