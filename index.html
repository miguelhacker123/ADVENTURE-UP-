<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-select=none">
    <title>Super Pizza Adventure Voxel - 20 Fases</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #050811;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 15px 50px rgba(0,0,0,0.9);
            border-radius: 4px;
            overflow: hidden;
            border: 4px solid #1e293b;
        }
        canvas {
            display: block;
            background: #000;
            image-rendering: pixelated;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 10;
        }
        .ui-element {
            background: rgba(15, 23, 42, 0.85);
            padding: 8px 16px;
            border-radius: 0px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
        }
        
        #btn-pause-top {
            pointer-events: auto;
            background: #eab308;
            color: #000;
            border: 3px solid #fef08a;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: 900;
            font-family: monospace;
            cursor: pointer;
            box-shadow: 3px 3px 0px #0f172a;
        }
        #btn-pause-top:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #0f172a;
        }

        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
        }
        .modal-title {
            font-size: 48px;
            font-weight: 900;
            color: #f59e0b;
            text-shadow: 4px 4px 0px #000;
            margin-bottom: 25px;
            letter-spacing: 3px;
        }
        .menu-btn {
            width: 220px;
            padding: 14px 0;
            margin: 8px 0;
            background: #2563eb;
            color: #fff;
            border: 4px solid #93c5fd;
            font-size: 18px;
            font-weight: 900;
            font-family: monospace;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            text-align: center;
        }
        .menu-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000;
            background: #3b82f6;
        }

        #levels-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-width: 400px;
            margin-bottom: 15px;
        }
        .lvl-btn {
            width: 55px;
            height: 55px;
            background: #334155;
            color: #fff;
            border: 3px solid #cbd5e1;
            font-size: 18px;
            font-weight: bold;
            font-family: monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
        }
        .lvl-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
            background: #eab308;
            color: #000;
        }

        #controls-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            z-index: 10;
        }
        .d-pad, .action-pad {
            display: flex;
            pointer-events: auto;
        }
        .d-pad {
            gap: 12px;
        }
        .action-pad {
            position: relative;
            width: 200px;
            height: 140px;
        }
        .btn-ctrl {
            width: 64px;
            height: 64px;
            background: #334155;
            border: 4px solid #cbd5e1;
            border-radius: 0px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            font-family: monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 4px 4px 0px #0f172a;
            transition: transform 0.05s, background 0.05s;
            touch-action: manipulation;
        }
        .btn-ctrl:active, .btn-ctrl.pressed {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #0f172a;
            background: #64748b;
            border-color: #f59e0b;
        }
        .btn-jump {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 110px;
            height: 52px;
            background: #15803d;
            border-color: #86efac;
            font-size: 14px;
        }
        .btn-dash {
            position: absolute;
            bottom: 60px;
            right: 0;
            width: 110px;
            height: 48px;
            background: #9333ea;
            border-color: #e9d5ff;
            font-size: 13px;
        }
        .btn-shield {
            position: absolute;
            top: 0;
            left: 10px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #16a34a;
            border: 4px solid #86efac;
            font-size: 10px;
            text-align: center;
            box-shadow: 3px 3px 0px #0f172a;
        }
        .btn-ctrl.cooldown {
            background: #475569 !important;
            border-color: #94a3b8 !important;
            color: #cbd5e1 !important;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui">
        <div class="ui-element">MOEDAS: <span id="coins-txt" style="color: #f59e0b;">0</span></div>
        <button id="btn-pause-top">PAUSE</button>
        <div class="ui-element">VIDAS: <span id="lives-txt" style="color: #ef4444;">3</span></div>
    </div>

    <!-- Menu Principal -->
    <div id="main-menu" class="modal-overlay">
        <div class="modal-title">PIZZA DASH</div>
        <button class="menu-btn" id="btn-play">PLAY</button>
        <button class="menu-btn" id="btn-fases-menu">FASES</button>
    </div>

    <!-- Menu de Pause -->
    <div id="pause-menu" class="modal-overlay" style="display: none;">
        <div class="modal-title">PAUSADO</div>
        <button class="menu-btn" id="btn-resume">CONTINUAR</button>
        <button class="menu-btn" id="btn-retry">RETRY</button>
        <button class="menu-btn" id="btn-menu-back">MENU</button>
    </div>

    <!-- Menu de Fases -->
    <div id="levels-menu" class="modal-overlay" style="display: none;">
        <div class="modal-title" style="font-size: 32px;">SELECIONE A FASE</div>
        <div id="levels-grid"></div>
        <button class="menu-btn" id="btn-back-main" style="width: 150px; padding: 8px 0; font-size: 14px; margin-top: 15px;">VOLTAR</button>
    </div>

    <canvas id="canvas" width="960" height="540"></canvas>

    <!-- Controls -->
    <div id="controls-container">
        <div class="d-pad">
            <div class="btn-ctrl" id="btn-left">&lt;</div>
            <div class="btn-ctrl" id="btn-right">&gt;</div>
        </div>
        <div class="action-pad">
            <div class="btn-ctrl btn-shield" id="btn-shield">ESCUDO</div>
            <div class="btn-ctrl btn-dash" id="btn-dash">DASH</div>
            <div class="btn-ctrl btn-jump" id="btn-jump">PULAR</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const coinsTxt = document.getElementById('coins-txt');
const livesTxt = document.getElementById('lives-txt');

const mainMenu = document.getElementById('main-menu');
const pauseMenu = document.getElementById('pause-menu');
const levelsMenu = document.getElementById('levels-menu');
const btnPauseTop = document.getElementById('btn-pause-top');
const btnPlay = document.getElementById('btn-play');
const btnFasesMenu = document.getElementById('btn-fases-menu');
const btnResume = document.getElementById('btn-resume');
const btnRetry = document.getElementById('btn-retry');
const btnMenuBack = document.getElementById('btn-menu-back');
const btnBackMain = document.getElementById('btn-back-main');
const levelsGrid = document.getElementById('levels-grid');
const btnDashElem = document.getElementById('btn-dash');
const btnShieldElem = document.getElementById('btn-shield');

let currentLevel = 1;
const maxLevels = 20;
let coinsCollected = 0;
let lives = 3;
let gameOver = false;
let gameWon = false;
let isPaused = false;
let inMainMenu = true;
let gameTime = 0;

const keys = {};
const touchControls = { left: false, right: false, jump: false, dash: false, shield: false };

window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

function setupBtn(id, controlProp) {
    const btn = document.getElementById(id);
    const start = (e) => { e.preventDefault(); touchControls[controlProp] = true; btn.classList.add('pressed'); };
    const end = (e) => { e.preventDefault(); touchControls[controlProp] = false; btn.classList.remove('pressed'); };

    btn.addEventListener('touchstart', start);
    btn.addEventListener('touchend', end);
    btn.addEventListener('mousedown', start);
    btn.addEventListener('mouseup', end);
    btn.addEventListener('mouseleave', end);
}
setupBtn('btn-left', 'left');
setupBtn('btn-right', 'right');
setupBtn('btn-jump', 'jump');
setupBtn('btn-dash', 'dash');
setupBtn('btn-shield', 'shield');

for (let i = 1; i <= maxLevels; i++) {
    const lvlBtn = document.createElement('div');
    lvlBtn.className = 'lvl-btn';
    lvlBtn.innerText = i;
    lvlBtn.onclick = () => {
        currentLevel = i;
        levelsMenu.style.display = 'none';
        startGame();
    };
    levelsGrid.appendChild(lvlBtn);
}

btnPlay.onclick = () => { startGame(); };
btnFasesMenu.onclick = () => { mainMenu.style.display = 'none'; levelsMenu.style.display = 'flex'; };
btnBackMain.onclick = () => { levelsMenu.style.display = 'none'; mainMenu.style.display = 'flex'; };
btnPauseTop.onclick = () => { if (inMainMenu) return; isPaused = true; pauseMenu.style.display = 'flex'; };
btnResume.onclick = () => { isPaused = false; pauseMenu.style.display = 'none'; };

btnRetry.onclick = () => {
    isPaused = false;
    pauseMenu.style.display = 'none';
    lives = 3;
    coinsCollected = 0;
    coinsTxt.innerText = coinsCollected;
    livesTxt.innerText = lives;
    gameOver = false;
    gameWon = false;
    loadLevel(currentLevel);
};

btnMenuBack.onclick = () => {
    isPaused = false;
    inMainMenu = true;
    pauseMenu.style.display = 'none';
    mainMenu.style.display = 'flex';
};

function startGame() {
    inMainMenu = false;
    isPaused = false;
    mainMenu.style.display = 'none';
    lives = 3;
    coinsCollected = 0;
    coinsTxt.innerText = coinsCollected;
    livesTxt.innerText = lives;
    gameOver = false;
    gameWon = false;
    loadLevel(currentLevel);
}

const camera = { x: 0, y: 0 };

let clouds = [];
for(let i=0; i<12; i++) {
    clouds.push({
        x: Math.random() * 8000,
        y: Math.random() * 120 + 20,
        w: Math.random() * 80 + 60,
        h: Math.random() * 20 + 20,
        speed: Math.random() * 0.4 + 0.2
    });
}

let particles = [];
function createSplash(x, y) {
    for (let i = 0; i < 15; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: -Math.random() * 5 - 2,
            size: Math.random() * 6 + 2,
            color: '#38bdf8',
            life: 25
        });
    }
}

function createSmoke(x, y) {
    for (let i = 0; i < 20; i++) {
        particles.push({
            x: x + Math.random() * 20 - 10,
            y: y + Math.random() * 20 - 10,
            vx: (Math.random() - 0.5) * 4,
            vy: -Math.random() * 3 - 1,
            size: Math.random() * 12 + 6,
            color: Math.random() > 0.5 ? '#94a3b8' : '#cbd5e1',
            life: 30
        });
    }
}

function createBlackSmoke(x, y, facing) {
    const dir = facing === 'right' ? -1 : 1;
    for (let i = 0; i < 12; i++) {
        particles.push({
            x: x,
            y: y + Math.random() * 30 - 15,
            vx: (dir * (Math.random() * 4 + 2)),
            vy: (Math.random() - 0.5) * 3,
            size: Math.random() * 10 + 4,
            color: Math.random() > 0.3 ? '#1e293b' : '#0f172a',
            life: 20
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawParticles() {
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - camera.x, p.y, p.size, p.size);
    });
}

const DASH_COOLDOWN_FRAMES = 12 * 60; // 12 segundos
const SHIELD_COOLDOWN_FRAMES = 8 * 60; // 8 segundos

const player = {
    x: 80,
    y: 100,
    width: 38,
    height: 42,
    vx: 0,
    vy: 0,
    speed: 4.2,
    jumpForce: 13.5,
    gravity: 0.6,
    grounded: false,
    facing: 'right',
    isDashing: false,
    dashTimer: 0,
    dashCooldown: 0,
    shieldActive: false,
    shieldTimer: 0,
    shieldCooldown: 0,
    reset: function() {
        this.x = 80;
        this.y = 100;
        this.vx = 0;
        this.vy = 0;
        this.isDashing = false;
        this.dashTimer = 0;
        this.dashCooldown = 0;
        this.shieldActive = false;
        this.shieldTimer = 0;
        this.shieldCooldown = 0;
        btnDashElem.innerText = "DASH";
        btnDashElem.classList.remove('cooldown');
        btnShieldElem.innerText = "ESCUDO";
        btnShieldElem.classList.remove('cooldown');
    }
};

let platforms = [];
let stoneWalls = [];
let waterZones = [];
let coins = [];
let enemies = [];
let flag = null;

function loadLevel(lvl) {
    platforms = [];
    stoneWalls = [];
    waterZones = [];
    coins = [];
    enemies = [];
    player.reset();

    const worldWidth = 6000 + lvl * 800;
    let currentX = 0;

    platforms.push({ x: 0, y: 440, width: 480, height: 100, type: 'dirt' });
    currentX = 480;

    while (currentX < worldWidth - 500) {
        let rand = Math.random();

        if (rand < 0.30) {
            let riverWidth = 160 + Math.random() * 160;
            waterZones.push({ x: currentX, y: 460, width: riverWidth, height: 80 });

            let logs = Math.floor(riverWidth / 80);
            for (let i = 0; i < logs; i++) {
                platforms.push({
                    x: currentX + 30 + (i * 75),
                    y: 350 - (Math.random() * 40),
                    width: 60,
                    height: 24,
                    type: 'log'
                });
            }
            currentX += riverWidth;
        } 
        else {
            let landWidth = 240 + Math.random() * 320;
            platforms.push({ x: currentX, y: 440, width: landWidth, height: 100, type: 'dirt' });

            // Paredes de Pedra
            if (Math.random() < 0.4) {
                stoneWalls.push({
                    x: currentX + 120,
                    y: 320,
                    width: 40,
                    height: 120
                });
            }

            if (Math.random() > 0.4) {
                let platY = 300 - Math.random() * 50;
                platforms.push({
                    x: currentX + 60,
                    y: platY,
                    width: 100,
                    height: 24,
                    type: 'log'
                });

                coins.push({ x: currentX + 80, y: platY - 45, collected: false });
                coins.push({ x: currentX + 120, y: platY - 45, collected: false });
            }

            if (Math.random() < 0.3 + (lvl * 0.02)) {
                enemies.push({
                    x: currentX + 180,
                    y: 408,
                    width: 44,
                    height: 32,
                    vx: (Math.random() > 0.5 ? 1 : -1) * (1.8 + lvl * 0.1),
                    minX: currentX,
                    maxX: currentX + landWidth - 44,
                    hp: 2,
                    flashTimer: 0
                });
            }

            if (Math.random() > 0.3) {
                coins.push({ x: currentX + landWidth / 2, y: 390, collected: false });
            }

            currentX += landWidth;
        }
    }

    platforms.push({ x: currentX, y: 440, width: 600, height: 100, type: 'dirt' });
    flag = { x: currentX + 250, y: 260, width: 24, height: 180 };
}

function update() {
    if (gameOver || gameWon || isPaused || inMainMenu) return;
    gameTime++;

    const moveLeft = keys['KeyA'] || keys['ArrowLeft'] || touchControls.left;
    const moveRight = keys['KeyD'] || keys['ArrowRight'] || touchControls.right;
    const moveJump = keys['KeyW'] || keys['Space'] || keys['ArrowUp'] || touchControls.jump;
    const moveDash = keys['ShiftLeft'] || keys['KeyK'] || touchControls.dash;
    const moveShield = keys['KeyE'] || touchControls.shield;

    // Cooldown e tempo do Escudo
    if (player.shieldTimer > 0) {
        player.shieldTimer--;
        if (player.shieldTimer <= 0) player.shieldActive = false;
    }
    if (player.shieldCooldown > 0) {
        player.shieldCooldown--;
        const shieldSecs = Math.ceil(player.shieldCooldown / 60);
        btnShieldElem.innerText = shieldSecs + "s";
        btnShieldElem.classList.add('cooldown');
    } else {
        btnShieldElem.innerText = "ESCUDO";
        btnShieldElem.classList.remove('cooldown');
    }

    // Ativar Escudo de Musgo
    if (moveShield && player.shieldCooldown === 0 && !player.shieldActive) {
        player.shieldActive = true;
        player.shieldTimer = 300; // 5 segundos ativo
        player.shieldCooldown = SHIELD_COOLDOWN_FRAMES; // 8s de recarga
    }

    // Cooldown do Dash
    if (player.dashCooldown > 0) {
        player.dashCooldown--;
        const secondsLeft = Math.ceil(player.dashCooldown / 60);
        btnDashElem.innerText = secondsLeft + "s";
        btnDashElem.classList.add('cooldown');
    } else {
        btnDashElem.innerText = "DASH";
        btnDashElem.classList.remove('cooldown');
    }

    // Ativar Dash
    if (moveDash && player.dashCooldown === 0 && !player.isDashing) {
        player.isDashing = true;
        player.dashTimer = 10; 
        player.dashCooldown = DASH_COOLDOWN_FRAMES; // 12s de recarga
        createBlackSmoke(player.x + player.width / 2, player.y + player.height / 2, player.facing);
    }

    if (player.isDashing) {
        player.dashTimer--;
        player.vy = 0;
        const dashSpeed = 16;
        player.vx = player.facing === 'right' ? dashSpeed : -dashSpeed;

        if (player.dashTimer <= 0) {
            player.isDashing = false;
        }
    } else {
        if (moveLeft) {
            player.vx = -player.speed;
            player.facing = 'left';
        } else if (moveRight) {
            player.vx = player.speed;
            player.facing = 'right';
        } else {
            player.vx *= 0.75;
        }

        if (moveJump && player.grounded) {
            player.vy = -player.jumpForce;
            player.grounded = false;
        }

        player.vy += player.gravity;
    }

    player.x += player.vx;
    player.y += player.vy;

    if (player.x < 0) player.x = 0;

    player.grounded = false;

    // Colisão com Paredes de Pedra (SÓ ATRAVESSA COM DASH)
    stoneWalls.forEach(wall => {
        if (!player.isDashing) {
            if (player.x < wall.x + wall.width &&
                player.x + player.width > wall.x &&
                player.y < wall.y + wall.height &&
                player.y + player.height > wall.y) {
                
                if (player.vx > 0) player.x = wall.x - player.width;
                else if (player.vx < 0) player.x = wall.x + wall.width;
            }
        }
    });

    // Apenas verifica colisões normais se NÃO estiver em Dash
    if (!player.isDashing) {
        // Plataformas
        platforms.forEach(p => {
            if (player.x < p.x + p.width &&
                player.x + player.width > p.x &&
                player.y + player.height > p.y &&
                player.y + player.height < p.y + p.height + player.vy + 4) {
                
                if (player.vy > 0) {
                    player.grounded = true;
                    player.vy = 0;
                    player.y = p.y - player.height;
                }
            }
        });

        // Água
        waterZones.forEach(w => {
            if (player.x + player.width > w.x && player.x < w.x + w.width && player.y + player.height > w.y + 20) {
                createSplash(player.x + player.width / 2, player.y + player.height);
                takeDamage();
            }
        });

        if (player.y > canvas.height + 100) {
            takeDamage();
        }

        // Inimigos
        enemies.forEach((enemy, index) => {
            if (enemy.flashTimer > 0) enemy.flashTimer--;

            if (player.x < enemy.x + enemy.width &&
                player.x + player.width > enemy.x &&
                player.y < enemy.y + enemy.height &&
                player.y + player.height > enemy.y) {
                
                if (player.vy > 0 && player.y + player.height - player.vy <= enemy.y + 16) {
                    player.vy = -player.jumpForce * 0.65;
                    enemy.hp--;
                    enemy.flashTimer = 18;

                    if (enemy.hp <= 0) {
                        createSmoke(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);
                        enemies.splice(index, 1);
                        coinsCollected += 3;
                        coinsTxt.innerText = coinsCollected;
                    }
                } else {
                    takeDamage();
                }
            }
        });
    }

    // Movimento Inimigos
    enemies.forEach(enemy => {
        enemy.x += enemy.vx;
        if (enemy.x <= enemy.minX || enemy.x >= enemy.maxX) {
            enemy.vx *= -1;
        }
    });

    // Moedas
    coins.forEach(c => {
        if (!c.collected && 
            player.x < c.x + 32 && player.x + player.width > c.x &&
            player.y < c.y + 32 && player.y + player.height > c.y) {
            c.collected = true;
            coinsCollected++;
            coinsTxt.innerText = coinsCollected;
        }
    });

    // Bandeira Final
    if (flag && player.x < flag.x + flag.width && player.x + player.width > flag.x &&
        player.y < flag.y + flag.height && player.y + player.height > flag.y) {
        if (currentLevel < maxLevels) {
            currentLevel++;
            loadLevel(currentLevel);
        } else {
            gameWon = true;
        }
    }

    camera.x += (player.x - canvas.width / 3 - camera.x) * 0.1;

    clouds.forEach(c => {
        c.x += c.speed;
        if (c.x > 8500) c.x = -100;
    });

    updateParticles();
}

function takeDamage() {
    if (player.shieldActive) return; // Escudo de musgo bloqueia o dano

    lives--;
    livesTxt.innerText = lives;
    if (lives <= 0) {
        gameOver = true;
    } else {
        player.reset();
    }
}

function draw() {
    let skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    skyGradient.addColorStop(0, '#0284c7');
    skyGradient.addColorStop(1, '#38bdf8');
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    let sunX = 800 - camera.x * 0.04;
    ctx.fillStyle = '#fef08a';
    ctx.fillRect(sunX, 40, 60, 60);
    ctx.fillStyle = '#fde047';
    ctx.fillRect(sunX + 6, 46, 48, 48);

    clouds.forEach(c => {
        let cx = c.x - camera.x * 0.15;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.fillRect(cx, c.y, c.w, c.h);
        ctx.fillRect(cx + 15, c.y - 12, c.w - 30, 12);
    });

    ctx.save();

    // Plataformas
    platforms.forEach(p => {
        let px = p.x - camera.x;
        
        if (p.type === 'dirt') {
            ctx.fillStyle = '#57331c';
            ctx.fillRect(px, p.y, p.width, p.height);

            ctx.fillStyle = '#3d2314';
            for (let bx = 0; bx < p.width; bx += 16) {
                for (let by = 16; by < p.height; by += 16) {
                    if ((bx + by) % 32 === 0) {
                        ctx.fillRect(px + bx, p.y + by, 8, 8);
                    }
                }
            }

            ctx.fillStyle = '#4ade80';
            ctx.fillRect(px, p.y, p.width, 14);

            ctx.fillStyle = '#16a34a';
            ctx.fillRect(px, p.y + 10, p.width, 4);

            ctx.fillStyle = '#22c55e';
            for (let g = 0; g < p.width; g += 16) {
                ctx.fillRect(px + g, p.y + 14, 8, 6);
                ctx.fillRect(px + g + 8, p.y + 14, 4, 3);
            }
        } 
        else if (p.type === 'log') {
            ctx.fillStyle = '#78350f';
            ctx.fillRect(px, p.y, p.width, p.height);

            ctx.fillStyle = '#451a03';
            ctx.fillRect(px, p.y, p.width, 4);
            ctx.fillRect(px, p.y + p.height - 4, p.width, 4);
            
            ctx.fillStyle = '#92400e';
            for (let lx = 10; lx < p.width; lx += 20) {
                ctx.fillRect(px + lx, p.y + 6, 12, p.height - 12);
            }
        }
    });

    // Paredes de Pedra (Passáveis apenas no Dash)
    stoneWalls.forEach(w => {
        let wx = w.x - camera.x;
        ctx.fillStyle = '#475569';
        ctx.fillRect(wx, w.y, w.width, w.height);
        ctx.fillStyle = '#334155';
        ctx.fillRect(wx + 4, w.y + 4, w.width - 8, w.height - 8);
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(wx + 8, w.y + 8, 10, w.height - 16);
    });

    // Água
    waterZones.forEach(w => {
        let wx = w.x - camera.x;
        
        ctx.fillStyle = 'rgba(14, 165, 233, 0.75)';
        ctx.fillRect(wx, w.y, w.width, w.height);

        ctx.fillStyle = '#0369a1';
        ctx.fillRect(wx, w.y + 20, w.width, w.height - 20);

        ctx.fillStyle = '#e0f2fe';
        for (let waveX = 0; waveX < w.width; waveX += 16) {
            let offset = (Math.sin((gameTime * 0.1) + waveX) > 0) ? 0 : 3;
            ctx.fillRect(wx + waveX, w.y + offset, 12, 4);
        }
    });

    // Moedas
    coins.forEach(c => {
        if (!c.collected) {
            let cx = c.x - camera.x + 16;
            let cy = c.y + 16;
            
            let scaleX = Math.abs(Math.sin((gameTime + c.x) * 0.05));
            let coinW = Math.max(4, 30 * scaleX);
            let coinH = 32;

            ctx.save();
            
            let glow = ctx.createRadialGradient(cx, cy, 2, cx, cy, 22);
            glow.addColorStop(0, 'rgba(255, 215, 0, 0.6)');
            glow.addColorStop(1, 'rgba(255, 215, 0, 0)');
            ctx.fillStyle = glow;
            ctx.fillRect(cx - 22, cy - 22, 44, 44);

            ctx.fillStyle = '#b45309';
            ctx.fillRect(cx - coinW/2 - 1, cy - coinH/2 - 1, coinW + 2, coinH + 2);

            let goldGrad = ctx.createLinearGradient(cx - coinW/2, cy - coinH/2, cx + coinW/2, cy + coinH/2);
            goldGrad.addColorStop(0, '#fef08a');
            goldGrad.addColorStop(0.3, '#f59e0b');
            goldGrad.addColorStop(0.7, '#d97706');
            goldGrad.addColorStop(1, '#78350f');
            ctx.fillStyle = goldGrad;
            ctx.fillRect(cx - coinW/2, cy - coinH/2, coinW, coinH);

            ctx.restore();
        }
    });

    // Inimigos
    enemies.forEach(e => {
        let ex = e.x - camera.x;
        let ey = e.y;
        let isFlashing = e.flashTimer > 0 && Math.floor(e.flashTimer / 3) % 2 === 0;

        ctx.save();
        let squish = Math.sin(gameTime * 0.2 + e.x) * 4;
        let slimeH = e.height + squish;
        let slimeW = e.width - squish;
        let drawY = ey + (e.height - slimeH);

        if (isFlashing) {
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(ex, drawY, slimeW, slimeH);
        } else {
            let slimeGrad = ctx.createLinearGradient(ex, drawY, ex, drawY + slimeH);
            slimeGrad.addColorStop(0, '#86efac');
            slimeGrad.addColorStop(0.5, '#22c55e');
            slimeGrad.addColorStop(1, '#15803d');
            ctx.fillStyle = slimeGrad;

            ctx.fillRect(ex + 4, drawY, slimeW - 8, slimeH);
            ctx.fillRect(ex, drawY + 6, slimeW, slimeH - 6);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(ex + 8, drawY + 8, 8, 10);
            ctx.fillRect(ex + 22, drawY + 8, 8, 10);

            ctx.fillStyle = '#0f172a';
            ctx.fillRect(ex + 11, drawY + 11, 4, 5);
            ctx.fillRect(ex + 25, drawY + 11, 4, 5);
        }

        ctx.restore();
    });

    // Bandeira Final
    if (flag) {
        let fx = flag.x - camera.x;
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(fx, flag.y, flag.width, flag.height);
        
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(fx - 4, flag.y - 8, 32, 10);

        ctx.fillStyle = '#dc2626';
        ctx.fillRect(fx + flag.width, flag.y + 10, 60, 45);
        ctx.fillStyle = '#b91c1c';
        ctx.fillRect(fx + flag.width, flag.y + 20, 50, 25);
    }

    // Personagem: PIZZA
    let px = player.x - camera.x;
    let py = player.y;

    if (player.isDashing) {
        ctx.globalAlpha = 0.5;
    }

    // Escudo de Musgo Visual
    if (player.shieldActive) {
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(px + player.width / 2, py + player.height / 2, 28, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = 'rgba(34, 197, 94, 0.2)';
        ctx.fill();
    }

    // Desenha a Fatia de Pizza
    ctx.save();
    if (player.facing === 'left') {
        ctx.translate(px + player.width, py);
        ctx.scale(-1, 1);
        px = 0;
        py = 0;
    }

    // Borda de casca
    ctx.fillStyle = '#d97706';
    ctx.fillRect(px, py + 4, 8, 34);

    // Queijo (Triângulo/Base da fatia)
    ctx.fillStyle = '#facc15';
    ctx.fillRect(px + 8, py + 8, 24, 26);
    ctx.fillRect(px + 32, py + 14, 8, 14);

    // Molho de tomate
    ctx.fillStyle = '#dc2626';
    ctx.fillRect(px + 8, py + 6, 24, 3);

    // Calabresas
    ctx.fillStyle = '#991b1b';
    ctx.fillRect(px + 12, py + 12, 6, 6);
    ctx.fillRect(px + 22, py + 22, 6, 6);
    ctx.fillRect(px + 14, py + 26, 6, 6);

    // Olhos na pizza
    ctx.fillStyle = '#000';
    ctx.fillRect(px + 24, py + 12, 4, 4);

    ctx.restore();

    ctx.globalAlpha = 1.0;

    drawParticles();

    ctx.restore();

    if (gameOver) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = '900 40px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('VOCE MORREU!', canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = '#fff';
        ctx.font = '16px monospace';
        ctx.fillText('RECARREGUE A PAGINA PARA RECOMEÇAR', canvas.width / 2, canvas.height / 2 + 30);
    }

    if (gameWon) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fbbf24';
        ctx.font = '900 40px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('PARABENS! JOGO ZERADO!', canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = '#fff';
        ctx.font = '16px monospace';
        ctx.fillText(`MOEDAS COLETADAS: ${coinsCollected}`, canvas.width / 2, canvas.height / 2 + 30);
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

loadLevel(1);
gameLoop();

</script>
