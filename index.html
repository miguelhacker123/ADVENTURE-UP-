<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-select=none">
    <title>Super Adventure Voxel - 20 Fases</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #050811;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 15px 50px rgba(0,0,0,0.9);
            border-radius: 4px;
            overflow: hidden;
            border: 4px solid #1e293b;
        }
        canvas {
            display: block;
            background: #000;
            image-rendering: pixelated;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 10;
        }
        .ui-element {
            background: rgba(15, 23, 42, 0.85);
            padding: 8px 16px;
            border-radius: 0px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
        }
        /* Botões de Controle 100% Quadrados */
        #controls-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            z-index: 10;
        }
        .d-pad, .jump-pad {
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }
        .btn-ctrl {
            width: 64px;
            height: 64px;
            background: #334155;
            border: 4px solid #cbd5e1;
            border-radius: 0px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            font-family: monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 4px 4px 0px #0f172a;
            transition: transform 0.05s, background 0.05s;
            touch-action: manipulation;
        }
        .btn-ctrl:active, .btn-ctrl.pressed {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #0f172a;
            background: #64748b;
            border-color: #f59e0b;
        }
        .btn-jump {
            width: 120px;
            background: #15803d;
            border-color: #86efac;
            font-size: 14px;
        }
        .btn-jump:active, .btn-jump.pressed {
            background: #22c55e;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui">
        <div class="ui-element">MOEDAS: <span id="coins-txt" style="color: #f59e0b;">0</span></div>
        <div class="ui-element">VIDAS: <span id="lives-txt" style="color: #ef4444;">3</span></div>
    </div>

    <canvas id="canvas" width="960" height="540"></canvas>

    <!-- Botões Totalmente Quadrados -->
    <div id="controls-container">
        <div class="d-pad">
            <div class="btn-ctrl" id="btn-left">&lt;</div>
            <div class="btn-ctrl" id="btn-right">&gt;</div>
        </div>
        <div class="jump-pad">
            <div class="btn-ctrl btn-jump" id="btn-jump">PULAR</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const coinsTxt = document.getElementById('coins-txt');
const livesTxt = document.getElementById('lives-txt');

let currentLevel = 1;
const maxLevels = 20;
let coinsCollected = 0;
let lives = 3;
let gameOver = false;
let gameWon = false;
let gameTime = 0;

const keys = {};
const touchControls = { left: false, right: false, jump: false };

window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

function setupBtn(id, controlProp) {
    const btn = document.getElementById(id);
    const start = (e) => { e.preventDefault(); touchControls[controlProp] = true; btn.classList.add('pressed'); };
    const end = (e) => { e.preventDefault(); touchControls[controlProp] = false; btn.classList.remove('pressed'); };

    btn.addEventListener('touchstart', start);
    btn.addEventListener('touchend', end);
    btn.addEventListener('mousedown', start);
    btn.addEventListener('mouseup', end);
    btn.addEventListener('mouseleave', end);
}
setupBtn('btn-left', 'left');
setupBtn('btn-right', 'right');
setupBtn('btn-jump', 'jump');

const camera = { x: 0, y: 0 };

// Nuvens Quadradas Estilo Minecraft
let clouds = [];
for(let i=0; i<12; i++) {
    clouds.push({
        x: Math.random() * 4000,
        y: Math.random() * 120 + 20,
        w: Math.random() * 80 + 60,
        h: Math.random() * 20 + 20,
        speed: Math.random() * 0.4 + 0.2
    });
}

// Partículas
let particles = [];
function createSplash(x, y) {
    for (let i = 0; i < 15; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: -Math.random() * 5 - 2,
            size: Math.random() * 6 + 2,
            color: '#38bdf8',
            life: 25
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawParticles() {
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - camera.x, p.y, p.size, p.size);
    });
}

// Jogador
const player = {
    x: 80,
    y: 100,
    width: 32,
    height: 48,
    vx: 0,
    vy: 0,
    speed: 6,
    jumpForce: 13.5,
    gravity: 0.6,
    grounded: false,
    facing: 'right',
    reset: function() {
        this.x = 80;
        this.y = 100;
        this.vx = 0;
        this.vy = 0;
    }
};

let platforms = [];
let waterZones = [];
let coins = [];
let enemies = [];
let flag = null;

// GERAÇÃO DE NÍVEIS
function loadLevel(lvl) {
    platforms = [];
    waterZones = [];
    coins = [];
    enemies = [];
    player.reset();

    const worldWidth = 3000 + lvl * 400;
    let currentX = 0;

    // Plataforma inicial segura
    platforms.push({ x: 0, y: 440, width: 480, height: 100, type: 'dirt' });
    currentX = 480;

    while (currentX < worldWidth - 500) {
        let rand = Math.random();

        // Rio / Água
        if (rand < 0.35) {
            let riverWidth = 160 + Math.random() * 160;
            waterZones.push({ x: currentX, y: 460, width: riverWidth, height: 80 });

            // Troncos estilo Minecraft sobre o rio
            let logs = Math.floor(riverWidth / 80);
            for (let i = 0; i < logs; i++) {
                platforms.push({
                    x: currentX + 30 + (i * 75),
                    y: 350 - (Math.random() * 40),
                    width: 60,
                    height: 24,
                    type: 'log'
                });
            }
            currentX += riverWidth;
        } 
        // Terra Minecraft
        else {
            let landWidth = 240 + Math.random() * 320;
            platforms.push({ x: currentX, y: 440, width: landWidth, height: 100, type: 'dirt' });

            // Plataformas Voadoras de Tronco
            if (Math.random() > 0.4) {
                let platY = 300 - Math.random() * 50;
                platforms.push({
                    x: currentX + 60,
                    y: platY,
                    width: 100,
                    height: 24,
                    type: 'log'
                });

                coins.push({ x: currentX + 80, y: platY - 45, collected: false });
                coins.push({ x: currentX + 120, y: platY - 45, collected: false });
            }

            // Inimigos Roxos
            if (Math.random() < 0.3 + (lvl * 0.02)) {
                enemies.push({
                    x: currentX + 100,
                    y: 404,
                    width: 36,
                    height: 36,
                    vx: (Math.random() > 0.5 ? 1 : -1) * (1.8 + lvl * 0.1),
                    minX: currentX,
                    maxX: currentX + landWidth - 36
                });
            }

            // Moedas no chão
            if (Math.random() > 0.3) {
                coins.push({ x: currentX + landWidth / 2, y: 390, collected: false });
            }

            currentX += landWidth;
        }
    }

    // Plataforma Final e Bandeira
    platforms.push({ x: currentX, y: 440, width: 600, height: 100, type: 'dirt' });
    flag = { x: currentX + 250, y: 260, width: 24, height: 180 };
}

// ATUALIZAÇÃO DO JOGO
function update() {
    if (gameOver || gameWon) return;
    gameTime++;

    const moveLeft = keys['KeyA'] || keys['ArrowLeft'] || touchControls.left;
    const moveRight = keys['KeyD'] || keys['ArrowRight'] || touchControls.right;
    const moveJump = keys['KeyW'] || keys['Space'] || keys['ArrowUp'] || touchControls.jump;

    if (moveLeft) {
        player.vx = -player.speed;
        player.facing = 'left';
    } else if (moveRight) {
        player.vx = player.speed;
        player.facing = 'right';
    } else {
        player.vx *= 0.75;
    }

    if (moveJump && player.grounded) {
        player.vy = -player.jumpForce;
        player.grounded = false;
    }

    player.vy += player.gravity;
    player.x += player.vx;
    player.y += player.vy;

    if (player.x < 0) player.x = 0;

    // Colisão com Plataformas
    player.grounded = false;
    platforms.forEach(p => {
        if (player.x < p.x + p.width &&
            player.x + player.width > p.x &&
            player.y + player.height > p.y &&
            player.y + player.height < p.y + p.height + player.vy + 4) {
            
            if (player.vy > 0) {
                player.grounded = true;
                player.vy = 0;
                player.y = p.y - player.height;
            }
        }
    });

    // Colisão com Água
    waterZones.forEach(w => {
        if (player.x + player.width > w.x && player.x < w.x + w.width && player.y + player.height > w.y + 20) {
            createSplash(player.x + player.width / 2, player.y + player.height);
            takeDamage();
        }
    });

    if (player.y > canvas.height + 100) {
        takeDamage();
    }

    // Inimigos Roxos
    enemies.forEach((enemy, index) => {
        enemy.x += enemy.vx;
        if (enemy.x <= enemy.minX || enemy.x >= enemy.maxX) {
            enemy.vx *= -1;
        }

        if (player.x < enemy.x + enemy.width &&
            player.x + player.width > enemy.x &&
            player.y < enemy.y + enemy.height &&
            player.y + player.height > enemy.y) {
            
            // Pular em cima do bixo
            if (player.vy > 0 && player.y + player.height - player.vy <= enemy.y + 12) {
                enemies.splice(index, 1);
                player.vy = -player.jumpForce * 0.65;
                coinsCollected += 3;
                coinsTxt.innerText = coinsCollected;
            } else {
                takeDamage();
            }
        }
    });

    // Coletar Moedas
    coins.forEach(c => {
        if (!c.collected && 
            player.x < c.x + 32 && player.x + player.width > c.x &&
            player.y < c.y + 32 && player.y + player.height > c.y) {
            c.collected = true;
            coinsCollected++;
            coinsTxt.innerText = coinsCollected;
        }
    });

    // Final da Fase
    if (flag && player.x < flag.x + flag.width && player.x + player.width > flag.x &&
        player.y < flag.y + flag.height && player.y + player.height > flag.y) {
        if (currentLevel < maxLevels) {
            currentLevel++;
            loadLevel(currentLevel);
        } else {
            gameWon = true;
        }
    }

    camera.x += (player.x - canvas.width / 3 - camera.x) * 0.1;

    clouds.forEach(c => {
        c.x += c.speed;
        if (c.x > 4500) c.x = -100;
    });

    updateParticles();
}

function takeDamage() {
    lives--;
    livesTxt.innerText = lives;
    if (lives <= 0) {
        gameOver = true;
    } else {
        player.reset();
    }
}

// DESENHO / GRÁFICOS
function draw() {
    // Céu azul estilo pixel
    let skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    skyGradient.addColorStop(0, '#0284c7');
    skyGradient.addColorStop(1, '#38bdf8');
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Sol Quadrado estilo Minecraft
    let sunX = 800 - camera.x * 0.04;
    ctx.fillStyle = '#fef08a';
    ctx.fillRect(sunX, 40, 60, 60);
    ctx.fillStyle = '#fde047';
    ctx.fillRect(sunX + 6, 46, 48, 48);

    // Nuvens Quadradas
    clouds.forEach(c => {
        let cx = c.x - camera.x * 0.15;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.fillRect(cx, c.y, c.w, c.h);
        ctx.fillRect(cx + 15, c.y - 12, c.w - 30, 12);
    });

    ctx.save();

    // DESENHAR BLOCOS DE TERRA MINECRAFT
    platforms.forEach(p => {
        let px = p.x - camera.x;
        
        if (p.type === 'dirt') {
            // Corpo da Terra
            ctx.fillStyle = '#57331c';
            ctx.fillRect(px, p.y, p.width, p.height);

            // Textura interna da terra
            ctx.fillStyle = '#3d2314';
            for (let bx = 0; bx < p.width; bx += 16) {
                for (let by = 16; by < p.height; by += 16) {
                    if ((bx + by) % 32 === 0) {
                        ctx.fillRect(px + bx, p.y + by, 8, 8);
                    }
                }
            }

            // Camada de Grama Superior
            ctx.fillStyle = '#4ade80';
            ctx.fillRect(px, p.y, p.width, 14);

            // Bloco de Grama Densa
            ctx.fillStyle = '#16a34a';
            ctx.fillRect(px, p.y + 10, p.width, 4);

            // Detalhes de grama caindo sobre a terra
            ctx.fillStyle = '#22c55e';
            for (let g = 0; g < p.width; g += 16) {
                ctx.fillRect(px + g, p.y + 14, 8, 6);
                ctx.fillRect(px + g + 8, p.y + 14, 4, 3);
            }
        } 
        // TRONCOS ESTILO MINECRAFT
        else if (p.type === 'log') {
            ctx.fillStyle = '#78350f';
            ctx.fillRect(px, p.y, p.width, p.height);

            ctx.fillStyle = '#451a03';
            ctx.fillRect(px, p.y, p.width, 4);
            ctx.fillRect(px, p.y + p.height - 4, p.width, 4);
            
            ctx.fillStyle = '#92400e';
            for (let lx = 10; lx < p.width; lx += 20) {
                ctx.fillRect(px + lx, p.y + 6, 12, p.height - 12);
            }
        }
    });

    // RIO / ÁGUA REALISTA COM ONDAS
    waterZones.forEach(w => {
        let wx = w.x - camera.x;
        
        ctx.fillStyle = 'rgba(14, 165, 233, 0.75)';
        ctx.fillRect(wx, w.y, w.width, w.height);

        ctx.fillStyle = '#0369a1';
        ctx.fillRect(wx, w.y + 20, w.width, w.height - 20);

        ctx.fillStyle = '#e0f2fe';
        for (let waveX = 0; waveX < w.width; waveX += 16) {
            let offset = (Math.sin((gameTime * 0.1) + waveX) > 0) ? 0 : 3;
            ctx.fillRect(wx + waveX, w.y + offset, 12, 4);
        }
    });

    // MOEDAS MAIORES E MAIS REALISTAS (3D / METÁLICAS COM ROTAÇÃO E GLOW)
    coins.forEach(c => {
        if (!c.collected) {
            let cx = c.x - camera.x + 16;
            let cy = c.y + 16;
            
            // Animação de rotação 3D
            let scaleX = Math.abs(Math.sin((gameTime + c.x) * 0.05));
            let coinW = Math.max(4, 30 * scaleX);
            let coinH = 32;

            ctx.save();
            
            // Brilho dourado ao fundo (Glow Effect)
            let glow = ctx.createRadialGradient(cx, cy, 2, cx, cy, 22);
            glow.addColorStop(0, 'rgba(255, 215, 0, 0.6)');
            glow.addColorStop(1, 'rgba(255, 215, 0, 0)');
            ctx.fillStyle = glow;
            ctx.fillRect(cx - 22, cy - 22, 44, 44);

            // Borda Metálica Externa (Sombra/Relevo)
            ctx.fillStyle = '#b45309';
            ctx.fillRect(cx - coinW/2 - 1, cy - coinH/2 - 1, coinW + 2, coinH + 2);

            // Camada Principal - Gradiente Metálico Realista
            let goldGrad = ctx.createLinearGradient(cx - coinW/2, cy - coinH/2, cx + coinW/2, cy + coinH/2);
            goldGrad.addColorStop(0, '#fef08a');
            goldGrad.addColorStop(0.3, '#f59e0b');
            goldGrad.addColorStop(0.7, '#d97706');
            goldGrad.addColorStop(1, '#78350f');
            ctx.fillStyle = goldGrad;
            ctx.fillRect(cx - coinW/2, cy - coinH/2, coinW, coinH);

            // Borda Interna Cizelada
            if (coinW > 12) {
                ctx.fillStyle = '#b45309';
                ctx.fillRect(cx - coinW/2 + 3, cy - coinH/2 + 3, coinW - 6, coinH - 6);
                
                ctx.fillStyle = '#fbbf24';
                ctx.fillRect(cx - coinW/2 + 4, cy - coinH/2 + 4, coinW - 8, coinH - 8);

                // Símbolo $ gravado no centro
                ctx.fillStyle = '#78350f';
                ctx.fillRect(cx - 2, cy - 8, 4, 16);
                ctx.fillRect(cx - 5, cy - 6, 10, 3);
                ctx.fillRect(cx - 5, cy - 1, 10, 3);
                ctx.fillRect(cx - 5, cy + 4, 10, 3);
            }

            // Reflexo de Luz Metálico (Flash)
            let flashX = cx - coinW/2 + ((gameTime * 2 + c.x) % (coinW + 10)) - 5;
            if (flashX > cx - coinW/2 && flashX < cx + coinW/2) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.fillRect(flashX, cy - coinH/2 + 2, 3, coinH - 4);
            }

            ctx.restore();
        }
    });

    // INIMIGOS BIXOS ROXOS
    enemies.forEach(e => {
        let ex = e.x - camera.x;
        let ey = e.y;

        ctx.fillStyle = '#7e22ce';
        ctx.fillRect(ex, ey, e.width, e.height);

        ctx.fillStyle = '#a855f7';
        ctx.fillRect(ex + 4, ey + 4, e.width - 8, e.height - 8);

        ctx.fillStyle = '#ef4444';
        let look = e.vx > 0 ? 4 : 0;
        ctx.fillRect(ex + 6 + look, ey + 10, 8, 8);
        ctx.fillRect(ex + 20 + look, ey + 10, 8, 8);

        ctx.fillStyle = '#fef08a';
        ctx.fillRect(ex + 8 + look, ey + 12, 4, 4);
        ctx.fillRect(ex + 22 + look, ey + 12, 4, 4);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(ex + 8, ey + 26, 6, 4);
        ctx.fillRect(ex + 22, ey + 26, 6, 4);
    });

    // BANDEIRA DE FINALIZAÇÃO
    if (flag) {
        let fx = flag.x - camera.x;
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(fx, flag.y, flag.width, flag.height);
        
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(fx - 4, flag.y - 8, 32, 10);

        ctx.fillStyle = '#dc2626';
        ctx.fillRect(fx + flag.width, flag.y + 10, 60, 45);
        ctx.fillStyle = '#b91c1c';
        ctx.fillRect(fx + flag.width, flag.y + 20, 50, 25);
    }

    // JOGADOR
    let px = player.x - camera.x;
    let py = player.y;

    ctx.fillStyle = '#ef4444';
    ctx.fillRect(px + 4, py, 24, 8);
    ctx.fillRect(px + (player.facing === 'right' ? 8 : 0), py + 4, 24, 4);

    ctx.fillStyle = '#fde047';
    ctx.fillRect(px + 6, py + 8, 20, 10);

    ctx.fillStyle = '#000';
    let eyeX = player.facing === 'right' ? 18 : 8;
    ctx.fillRect(px + eyeX, py + 10, 4, 4);

    ctx.fillStyle = '#dc2626';
    ctx.fillRect(px + 4, py + 18, 24, 12);

    ctx.fillStyle = '#2563eb';
    ctx.fillRect(px + 6, py + 26, 20, 14);

    ctx.fillStyle = '#78350f';
    ctx.fillRect(px + 2, py + 40, 12, 8);
    ctx.fillRect(px + 18, py + 40, 12, 8);

    drawParticles();

    ctx.restore();

    // GAME OVER OVERLAY
    if (gameOver) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = '900 40px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('VOCE MORREU!', canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = '#fff';
        ctx.font = '16px monospace';
        ctx.fillText('RECARREGUE A PAGINA PARA RECOMEÇAR', canvas.width / 2, canvas.height / 2 + 30);
    }

    // VITÓRIA OVERLAY
    if (gameWon) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fbbf24';
        ctx.font = '900 40px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('PARABENS! JOGO ZERADO!', canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = '#fff';
        ctx.font = '16px monospace';
        ctx.fillText(`MOEDAS COLETADAS: ${coinsCollected}`, canvas.width / 2, canvas.height / 2 + 30);
    }
}

// LOOP PRINCIPAL
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

loadLevel(1);
gameLoop();

</script>
</body>
</html>
